apiVersion: vendir.k14s.io/v1alpha1
kind: Config
minimumRequiredVersion: 0.12.0
directories:
# Stage 1: pristine upstream artifacts. Nothing here is published; the flatten
# below copies from it, and sync/sync.sh diffs it against the chart to produce
# diffs/, so a reviewer of a version bump sees the whole delta from upstream.
- path: vendor
  contents:
  # Upstream agentgateway controller chart: the kgateway-based control plane
  # (controller + data-plane proxy). It ships NO CRDs of its own.
  - path: agentgateway
    helmChart:
      name: agentgateway
      version: "v1.4.1"
      repository:
        url: oci://cr.agentgateway.dev/charts
  # Upstream agentgateway-crds chart. Its templates/ holds the pristine
  # agentgateway.dev CRD manifests (AgentgatewayBackend, AgentgatewayPolicy,
  # AgentgatewayParameters, AgentgatewayModel).
  - path: agentgateway-crds
    helmChart:
      name: agentgateway-crds
      version: "v1.4.1"
      repository:
        url: oci://cr.agentgateway.dev/charts

# Stage 2: flatten the upstream controller chart onto the chart root, so
# consumers set upstream keys at the top level (controller.*) with no wrapper
# nesting. ignorePaths lists the files this repo owns; vendir leaves those
# alone instead of deleting them as unmanaged content. sync/sync.sh then
# re-applies the Giant Swarm delta (see sync/patches/).
- path: helm/agentgateway
  contents:
  - path: .
    directory:
      path: vendor/agentgateway
    ignorePaths:
    # Chart metadata is ours: our own version line, our team annotation, and no
    # dependency on upstream. sync/patches/chart_yaml keeps appVersion in step
    # with the vendored version.
    - Chart.yaml
    # App-owned CRDs, written by sync/patches/crds from vendor/agentgateway-crds.
    - crds/**/*
    # Repo-owned docs and generated schema. values.schema.json is regenerated by
    # the helm-schema pre-commit hook from values.yaml + .schema.yaml.
    - README.md
    - README.md.gotmpl
    - .kube-linter.yaml
    - .schema.yaml
    - values.schema.json
    - zz_generated.app-platform.values.yaml

# Stage 2b: the CRD chart, published from this repo as the optional
# Helm-managed CRD lifecycle path (templated CRDs, `keep` injected by
# sync/patches/crds). Consumers that let Helm own the CRDs install this chart
# and disable the crds/ dir of the main chart.
- path: helm/agentgateway-crds
  contents:
  - path: .
    directory:
      path: vendor/agentgateway-crds
    ignorePaths:
    # Chart metadata is ours; README.md is generated by helm-docs. The chart has
    # no values.schema.json on purpose: its values are empty, and the app
    # platform injects cluster values that a strict generated schema would
    # reject. devctl's generated pre-commit hook covers helm/agentgateway only.
    - Chart.yaml
    - README.md
    - README.md.gotmpl
    - templates/_helpers.tpl
    # app-build-suite's Giant Swarm validator (F0001) requires a values schema.
    # Hand-written and permissive: devctl's generated schema pre-commit hook
    # covers helm/agentgateway only, and the app platform injects cluster values
    # a strict schema would reject.
    - values.schema.json
