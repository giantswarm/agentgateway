# app-test-suite (ATS >= 1.0) config, consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests). The job creates the
# kind cluster and hands ATS its kubeconfig; helm and kubectl come with the
# ATS image.
#
# Smoke: the ATS image bootstraps the Gateway API CRDs (standard channel plus
# the inference extension, /etc/ats/crds in the image) before the deploy; ATS
# then installs the packaged chart with `helm upgrade --install --wait` (the
# agentgateway.dev CRDs ship in the chart's crds/, controller and proxy images
# are the gsoci mirrors) and the controller creates its own GatewayClass
# (`agentgateway`) once it runs, so nothing else has to be provisioned first.
# tests/ats asserts that the controller Deployment is ready.
#
# functional and upgrade stay skipped: there is no second scenario yet.
skip-steps: [functional,upgrade]
