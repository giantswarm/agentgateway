# Repo-owned, not devctl-generated.
#
# vendir sync rewrites the vendored subchart and the pristine CRDs. Two things
# in this repo have to be re-derived afterwards, and neither Renovate nor a
# hand-run `vendir sync` does it:
#
#   - Chart.yaml's dependency version, which Helm resolves against. When it
#     disagrees with charts/agentgateway, Helm loads the older subchart and the
#     published chart silently ships a controller nobody chose.
#   - helm.sh/resource-policy: keep on every vendored CRD, without which a helm
#     uninstall cascade-deletes every agentgateway CR on the cluster.
#
# `make update-deps` re-derives both. This job fails the PR when it was skipped.
name: Verify vendored chart

on:
  pull_request:
    paths:
      - 'helm/**'
      - 'vendir.yml'
      - 'vendir.lock.yml'
      - 'Makefile.custom.mk'
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make verify-subchart-version
