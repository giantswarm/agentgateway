# See https://docs.giantswarm.io/reference/platform-api/chart-metadata/
# for details and background.
#
# Optional Helm-managed CRD lifecycle for the agentgateway.dev CRDs, published
# from the same vendored manifests as helm/agentgateway/crds/. Install this
# chart INSTEAD of relying on that dir; installing both makes two Helm releases
# own the same cluster-scoped objects.

apiVersion: v2
# Kept in step with the vendored agentgateway-crds chart by
# sync/patches/chart-yaml.
appVersion: v1.5.0
name: agentgateway-crds
description: Giant Swarm packaging of the upstream agentgateway.dev CRDs (AgentgatewayBackend, AgentgatewayModel, AgentgatewayParameters, AgentgatewayPolicy) as a Helm-managed chart.
home: https://github.com/giantswarm/agentgateway
icon: https://s.giantswarm.io/app-icons/giantswarm/1/light.svg
sources:
  - https://github.com/giantswarm/agentgateway
  - https://github.com/agentgateway/agentgateway
version: 0.0.0-dev
annotations:
  io.giantswarm.application.audience: all
  io.giantswarm.application.managed: "true"
  io.giantswarm.application.team: bumblebee
